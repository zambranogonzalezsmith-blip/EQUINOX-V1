name: Deploy · GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Vite + PWA para GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolver base path de Vite para GitHub Pages
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          if [ -n "$RAW_BASE" ]; then
            RESOLVED_BASE="${RAW_BASE%/}/"
          elif [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            RESOLVED_BASE="/"
          else
            RESOLVED_BASE="/${{ github.event.repository.name }}/"
          fi
          echo "VITE_BASE_PATH=${RESOLVED_BASE}" >> "$GITHUB_ENV"
          echo "Base path configurado: ${RESOLVED_BASE}"

      - name: Compilar aplicación estática (dist/)
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verificar artefacto compilado en dist/
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -d dist/assets
          if grep -q '/src/main\.tsx' dist/index.html; then
            echo "ERROR: dist/index.html sigue apuntando a /src/main.tsx en lugar de los bundles compilados."
            exit 1
          fi
          if ! grep -q "${VITE_BASE_PATH}assets/" dist/index.html; then
            echo "ERROR: dist/index.html no contiene referencias a ${VITE_BASE_PATH}assets/."
            exit 1
          fi
          echo "Verificación de dist/ aprobada con base ${VITE_BASE_PATH}."

      - name: Subir artefacto de GitHub Pages (solo dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
